<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教师管理后台 — 研究生课程《机器人系统》</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Microsoft YaHei", "Noto Sans SC", sans-serif; background: #f5f5f5; color: #333; }
  .header { background: #1565c0; color: #fff; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; }
  .header h1 { font-size: 1.2rem; }
  .header button { background: rgba(255,255,255,.2); color: #fff; border: 1px solid rgba(255,255,255,.5); padding: 6px 16px; border-radius: 4px; cursor: pointer; }
  .header button:hover { background: rgba(255,255,255,.35); }
  .container { max-width: 1000px; margin: 24px auto; padding: 0 16px; }
  .card { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.12); margin-bottom: 20px; overflow: hidden; }
  .card-title { background: #e3f2fd; padding: 12px 20px; font-weight: bold; font-size: .95rem; border-bottom: 1px solid #bbdefb; display: flex; align-items: center; justify-content: space-between; }
  .card-body { padding: 20px; }
  .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .login-box { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,.15); width: 340px; text-align: center; }
  .login-box h2 { margin-bottom: 8px; color: #1565c0; }
  .login-box p { color: #888; margin-bottom: 24px; font-size: .9rem; }
  input[type=text], input[type=password], input[type=file] { width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; margin-bottom: 12px; }
  input[type=text]:focus, input[type=password]:focus { outline: none; border-color: #1565c0; }
  .btn { display: inline-block; padding: 10px 24px; border: none; border-radius: 6px; cursor: pointer; font-size: .95rem; font-weight: bold; }
  .btn-primary { background: #1565c0; color: #fff; }
  .btn-primary:hover { background: #0d47a1; }
  .btn-success { background: #2e7d32; color: #fff; }
  .btn-success:hover { background: #1b5e20; }
  .btn-danger { background: #c62828; color: #fff; }
  .btn-danger:hover { background: #b71c1c; }
  .btn-warning { background: #e65100; color: #fff; }
  .btn-warning:hover { background: #bf360c; }
  .btn-outline { background: transparent; color: #1565c0; border: 1px solid #1565c0; }
  .btn-outline:hover { background: #e3f2fd; }
  .btn-outline-danger { background: transparent; color: #c62828; border: 1px solid #c62828; }
  .btn-outline-danger:hover { background: #ffebee; }
  .btn-sm { padding: 6px 14px; font-size: .85rem; }
  .btn-full { width: 100%; }
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .stat-item { background: #f8f9fa; border-radius: 8px; padding: 16px; text-align: center; }
  .stat-value { font-size: 1.8rem; font-weight: bold; color: #1565c0; }
  .stat-label { font-size: .8rem; color: #888; margin-top: 4px; }
  .exam-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .exam-tab { padding: 6px 16px; border-radius: 20px; border: 1px solid #1565c0; color: #1565c0; cursor: pointer; font-size: .9rem; background: #fff; }
  .exam-tab.active { background: #1565c0; color: #fff; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th { background: #e3f2fd; padding: 10px 12px; text-align: left; font-weight: bold; }
  td { padding: 9px 12px; border-bottom: 1px solid #f0f0f0; }
  tr:hover td { background: #fafafa; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 12px; font-size: .8rem; }
  .badge-green { background: #e8f5e9; color: #2e7d32; }
  .badge-gray { background: #f5f5f5; color: #888; }
  .upload-area { border: 2px dashed #bbdefb; border-radius: 8px; padding: 24px; text-align: center; cursor: pointer; transition: border-color .2s; }
  .upload-area:hover { border-color: #1565c0; }
  .upload-area input { display: none; }
  .upload-hint { color: #888; font-size: .9rem; margin-top: 8px; }
  .alert { padding: 12px 16px; border-radius: 6px; margin-bottom: 12px; font-size: .9rem; }
  .alert-success { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
  .alert-error { background: #ffebee; color: #c62828; border: 1px solid #ef9a9a; }
  .flex-row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .toggle-switch { display: flex; align-items: center; gap: 8px; }
  .switch { position: relative; width: 42px; height: 24px; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .slider { position: absolute; inset: 0; background: #ccc; border-radius: 24px; cursor: pointer; transition: .3s; }
  .slider:before { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; bottom: 3px; background: #fff; border-radius: 50%; transition: .3s; }
  input:checked + .slider { background: #1565c0; }
  input:checked + .slider:before { transform: translateX(18px); }
  /* 添加学生表单 */
  .add-form { display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 8px; align-items: end; }
  .add-form input { margin-bottom: 0; }
  .form-label { font-size: .8rem; color: #555; margin-bottom: 4px; display: block; }
  /* 确认弹窗 */
  .confirm-dialog-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 9999; display: flex; align-items: center; justify-content: center; }
  .confirm-dialog { background: #fff; border-radius: 10px; padding: 28px 24px; max-width: 400px; width: 90%; box-shadow: 0 8px 32px rgba(0,0,0,.2); text-align: center; }
  .confirm-dialog h3 { margin-bottom: 10px; }
  .confirm-dialog p { color: #666; font-size: .9rem; margin-bottom: 20px; line-height: 1.6; }
  .confirm-dialog .btn-row { display: flex; gap: 10px; justify-content: center; }
  #app { display: none; }
  /* Issues card repo input styling */
  .repo-row { display:flex; gap:8px; align-items:center; margin-bottom:8px; }
  .repo-row input { flex:1; padding:8px 10px; border:1px solid #ddd; border-radius:6px; font-size:0.95rem; }
  .repo-row button { padding:8px 12px; border-radius:6px; }

  /* Progress bar */
  .progress-root { width:100%; height:22px; background:#e9ecef; border-radius:11px; overflow:hidden; margin:8px 0; }
  .progress-fill { height:100%; background:linear-gradient(90deg,#4ade80,#22c55e); border-radius:11px; transition:width 0.5s ease; min-width:0; }
  .progress-fill.has-warn { background:linear-gradient(90deg,#fbbf24,#f59e0b); }
  .progress-fill.has-only-err { background:linear-gradient(90deg,#f87171,#ef4444); }

  /* Mobile improvements */
  @media (max-width:600px) {
    .login-box { width: 92%; padding: 24px; }
    .repo-row { flex-direction: column; align-items: stretch; }
    .repo-row button { width: 100%; }
    .card-title, .card-body { padding-left:12px; padding-right:12px; }
  }
</style>
</head>
<body>

<!-- 登录页 -->
<div id="login-page" class="login-wrap">
  <div class="login-box">
    <h2>🎓 教师管理后台</h2>
    <p>研究生课程《机器人系统》考试系统</p>
    <div id="login-msg"></div>
    <input type="password" id="login-pwd" placeholder="请输入教师密码" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn btn-primary btn-full" onclick="doLogin()">登 录</button>
  </div>
</div>
<!-- 主界面 -->
<div id="app">
  <div class="header">
    <h1>🎓 教师管理后台 — 研究生课程《机器人系统》</h1>
    <button onclick="logout()">退出登录</button>
  </div>
  <div class="container">

    <!-- 需求转 GitHub Issues（教师功能：仅在登录后可见） -->
    <div class="card">
      <div class="card-title">🔀 需求转 GitHub Issues（上传 Markdown 预览）</div>
      <div class="card-body">
        <div id="issues-msg"></div>
        <div class="repo-row">
          <input type="text" id="issues-repo" placeholder="目标仓库 owner/repo（将保存在本地）" aria-label="目标仓库" />
          <button class="btn btn-outline btn-sm" id="save-repo-btn">保存默认</button>
        </div>
        <p style="font-size:.88rem;color:#888;margin-bottom:12px">上传包含 F-xxx 标识的 Markdown 文件，系统将解析出候选 Issue。</p>
        <input type="file" id="md-file" accept=".md" />
        <div style="margin-top:12px;display:flex;gap:8px">
          <button class="btn btn-primary" onclick="previewIssues()">解析并预览</button>
          <button class="btn btn-outline" onclick="document.getElementById('md-file').value=''">清空</button>
        </div>
        <div id="preview-area" style="margin-top:12px"></div>
      </div>
    </div>


    

    <!-- 上传名单 -->
    <div class="card">
      <div class="card-title">📋 上传学生名单（批量）</div>
      <div class="card-body">
        <div id="upload-msg"></div>
        <p style="font-size:.88rem;color:#888;margin-bottom:12px">
          CSV 格式：<code>姓名,学号,班级</code>（第一行为表头，编码 UTF-8 或 GBK 均支持）
        </p>
        <label class="upload-area" id="upload-area">
          <input type="file" id="csv-file" accept=".csv" onchange="handleFile(this)">
          <div style="font-size:2rem">📂</div>
          <div>点击选择 CSV 文件</div>
          <div class="upload-hint" id="file-name">未选择文件</div>
        </label>
        <div style="margin-top:12px">
          <button class="btn btn-success" onclick="uploadStudents()">上传名单</button>
        </div>
      </div>
    </div>

    <!-- 学生名单管理 -->
    <div class="card">
      <div class="card-title">
        <span>👤 学生名单管理</span>
        <div style="display:flex;gap:8px">
          <button class="btn btn-outline-danger btn-sm" onclick="confirmClearStudents()">🗑 清空全部名单</button>
          <button class="btn btn-warning btn-sm" onclick="confirmNewSemester()">🔄 新学期重置</button>
        </div>
      </div>
      <div class="card-body">
        <div id="student-msg"></div>

        <!-- 添加单个学生 -->
        <div style="margin-bottom:16px;">
          <p style="font-size:.88rem;font-weight:bold;margin-bottom:8px;color:#555">➕ 添加单个学生</p>
          <div class="add-form">
            <div>
              <label class="form-label">姓名 *</label>
              <input type="text" id="add-name" placeholder="如：张三">
            </div>
            <div>
              <label class="form-label">学号 *</label>
              <input type="text" id="add-sid" placeholder="如：20230001">
            </div>
            <div>
              <label class="form-label">班级（可选）</label>
              <input type="text" id="add-class" placeholder="如：2023级软工1班">
            </div>
            <button class="btn btn-primary btn-sm" style="height:42px;white-space:nowrap" onclick="addStudent()">添加</button>
          </div>
        </div>

        <!-- 学生列表 -->
        <div id="student-list">加载中…</div>
      </div>
    </div>

    <!-- 考试管理 -->
    <div class="card">
      <div class="card-title">📝 考试管理 & 成绩查看</div>
      <div class="card-body">
        <div id="exams-content">加载中…</div>
      </div>
    </div>

  </div>
</div>

<script>
const API = '';
let TOKEN = sessionStorage.getItem('teacher_token') || '';

function showMsg(id, msg, type='success') {
  const el = document.getElementById(id);
  el.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
  setTimeout(() => { if(el) el.innerHTML=''; }, 5000);
}

async function doLogin() {
  const pwd = document.getElementById('login-pwd').value;
  try {
    const r = await fetch(`${API}/api/teacher/login`, {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({password: pwd})
    });
    if (!r.ok) { const e = await r.json(); showMsg('login-msg', e.detail || '密码错误', 'error'); return; }
    const d = await r.json();
    TOKEN = d.token;
    sessionStorage.setItem('teacher_token', TOKEN);
    document.getElementById('login-page').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    loadExams();
    loadStudentList();
  } catch(e) { showMsg('login-msg', '网络错误：' + e, 'error'); }
}

function logout() {
  TOKEN = '';
  sessionStorage.removeItem('teacher_token');
  location.reload();
}

function handleFile(input) {
  document.getElementById('file-name').textContent = input.files[0]?.name || '未选择文件';
}

async function uploadStudents() {
  const file = document.getElementById('csv-file').files[0];
  if (!file) { showMsg('upload-msg', '请先选择 CSV 文件', 'error'); return; }
  const fd = new FormData();
  fd.append('file', file);
  try {
    const r = await fetch(`${API}/api/teacher/students`, {
      method: 'POST',
      headers: {'Authorization': `Bearer ${TOKEN}`},
      body: fd
    });
    const d = await r.json();
    if (!r.ok) { showMsg('upload-msg', d.detail || '上传失败', 'error'); return; }
    showMsg('upload-msg', `✅ 成功导入 ${d.count} 名学生`, 'success');
    loadExams();
    loadStudentList();
  } catch(e) { showMsg('upload-msg', '网络错误：' + e, 'error'); }
}

let currentExamId = null;
let examsData = [];

async function loadExams() {
  const r = await fetch(`${API}/api/teacher/exams`, {
    headers: {'Authorization': `Bearer ${TOKEN}`}
  });
  if (r.status === 401) { logout(); return; }
  examsData = await r.json();
  renderExams();
}

function renderExams() {
  if (!examsData.length) {
    document.getElementById('exams-content').innerHTML = '<p style="color:#888">暂无考试记录</p>';
    return;
  }
  if (!currentExamId) currentExamId = examsData[0].id;

  const tabs = examsData.map(e => `
    <button class="exam-tab ${e.id===currentExamId?'active':''}" onclick="switchExam('${e.id}')">${e.title}</button>
  `).join('');

  const exam = examsData.find(e => e.id === currentExamId) || examsData[0];
  const isActive = exam.is_active === 1;

  document.getElementById('exams-content').innerHTML = `
    <div class="exam-tabs">${tabs}</div>
    <div class="stats-grid">
      <div class="stat-item"><div class="stat-value">${exam.total_students}</div><div class="stat-label">名单人数</div></div>
      <div class="stat-item"><div class="stat-value">${exam.submitted}</div><div class="stat-label">已提交</div></div>
      <div class="stat-item"><div class="stat-value">${exam.avg_score ?? '—'}</div><div class="stat-label">平均分</div></div>
      <div class="stat-item"><div class="stat-value">${exam.total_students ? Math.round(exam.submitted/exam.total_students*100) : 0}%</div><div class="stat-label">完成率</div></div>
    </div>
    <div class="flex-row" style="margin-bottom:16px">
      <div class="toggle-switch">
        <span style="font-size:.9rem">考试状态：</span>
        <label class="switch">
          <input type="checkbox" ${isActive?'checked':''} onchange="toggleExam('${exam.id}', this.checked)">
          <span class="slider"></span>
        </label>
        <span style="font-size:.9rem;color:${isActive?'#2e7d32':'#888'}">${isActive?'开放中':'已关闭'}</span>
      </div>
      <button class="btn btn-primary btn-sm" onclick="downloadExcel('${exam.id}', '${exam.title}')">⬇ 下载 Excel 成绩单</button>
    </div>
    <div id="scores-table">加载成绩中…</div>
  `;
  loadScores(currentExamId);
}

async function switchExam(id) {
  currentExamId = id;
  renderExams();
}

async function toggleExam(id, active) {
  await fetch(`${API}/api/teacher/exams/${id}`, {
    method: 'PUT',
    headers: {'Authorization':`Bearer ${TOKEN}`,'Content-Type':'application/json'},
    body: JSON.stringify({is_active: active ? 1 : 0})
  });
  loadExams();
}

async function loadScores(examId) {
  const r = await fetch(`${API}/api/teacher/scores?exam_id=${examId}`, {
    headers: {'Authorization': `Bearer ${TOKEN}`}
  });
  const d = await r.json();
  const rows = d.rows || [];
  if (!rows.length) {
    document.getElementById('scores-table').innerHTML = '<p style="color:#888;margin-top:8px">名单为空，请先上传学生名单</p>';
    return;
  }
  const tbody = rows.map(r => `
    <tr>
      <td>${r.name}</td>
      <td>${r.student_id}</td>
      <td>${r.class_name || '—'}</td>
      <td>${r.score !== null ? `<strong>${r.score}</strong>` : '<span style="color:#bbb">未提交</span>'}</td>
      <td>${r.total ?? '—'}</td>
      <td style="font-size:.85rem;color:#888">${r.submitted_at || '—'}</td>
    </tr>
  `).join('');
  document.getElementById('scores-table').innerHTML = `
    <table>
      <thead><tr><th>姓名</th><th>学号</th><th>班级</th><th>得分</th><th>满分</th><th>提交时间</th></tr></thead>
      <tbody>${tbody}</tbody>
    </table>
  `;
}

async function downloadExcel(examId, title) {
  const url = `${API}/api/teacher/scores/export?exam_id=${examId}`;
  const r = await fetch(url, { headers: {'Authorization': `Bearer ${TOKEN}`} });
  if (!r.ok) { alert('导出失败'); return; }
  const blob = await r.blob();
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  const date = new Date().toISOString().slice(0,10).replace(/-/g,'');
  a.download = `成绩单_${title}_${date}.xlsx`;
  a.click();
}

// ───── 学生名单管理 ─────

async function loadStudentList() {
  const r = await fetch(`${API}/api/teacher/students/list`, {
    headers: {'Authorization': `Bearer ${TOKEN}`}
  });
  if (!r.ok) { document.getElementById('student-list').innerHTML = '<p style="color:#c62828">加载失败</p>'; return; }
  const students = await r.json();
  if (!students.length) {
    document.getElementById('student-list').innerHTML = '<p style="color:#888;font-size:.9rem">名单为空，请添加学生或上传 CSV</p>';
    return;
  }
  const rows = students.map(s => `
    <tr>
      <td>${s.name}</td>
      <td>${s.student_id}</td>
      <td>${s.class_name || '—'}</td>
      <td>
        <button class="btn btn-outline-danger btn-sm" onclick="deleteStudent('${s.student_id}','${s.name}')">删除</button>
      </td>
    </tr>
  `).join('');
  document.getElementById('student-list').innerHTML = `
    <p style="font-size:.85rem;color:#888;margin-bottom:8px">共 ${students.length} 名学生</p>
    <table>
      <thead><tr><th>姓名</th><th>学号</th><th>班级</th><th>操作</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

async function addStudent() {
  const name = document.getElementById('add-name').value.trim();
  const sid  = document.getElementById('add-sid').value.trim();
  const cls  = document.getElementById('add-class').value.trim();
  if (!name || !sid) { showMsg('student-msg', '姓名和学号不能为空', 'error'); return; }
  try {
    const r = await fetch(`${API}/api/teacher/students/add`, {
      method: 'POST',
      headers: {'Authorization': `Bearer ${TOKEN}`, 'Content-Type': 'application/json'},
      body: JSON.stringify({name, student_id: sid, class_name: cls || null})
    });
    const d = await r.json();
    if (!r.ok) { showMsg('student-msg', d.detail || '添加失败', 'error'); return; }
    showMsg('student-msg', `✅ 已添加学生：${name}（${sid}）`);
    document.getElementById('add-name').value = '';
    document.getElementById('add-sid').value = '';
    document.getElementById('add-class').value = '';
    loadStudentList();
    loadExams();
  } catch(e) { showMsg('student-msg', '网络错误：' + e, 'error'); }
}

async function deleteStudent(sid, name) {
  showConfirmDialog(
    '删除学生',
    `确认删除学生 <strong>${name}（${sid}）</strong>？<br>该学生的成绩记录也将一并删除。`,
    async () => {
      const r = await fetch(`${API}/api/teacher/students/${encodeURIComponent(sid)}`, {
        method: 'DELETE',
        headers: {'Authorization': `Bearer ${TOKEN}`}
      });
      const d = await r.json();
      if (!r.ok) { showMsg('student-msg', d.detail || '删除失败', 'error'); return; }
      showMsg('student-msg', `✅ 已删除学生：${name}`);
      loadStudentList();
      loadExams();
    }
  );
}

function confirmClearStudents() {
  showConfirmDialog(
    '⚠️ 清空全部学生名单',
    '此操作将删除<strong>所有学生名单</strong>及其成绩记录，无法恢复。<br>确认要继续吗？',
    async () => {
      const r = await fetch(`${API}/api/teacher/students`, {
        method: 'DELETE',
        headers: {'Authorization': `Bearer ${TOKEN}`}
      });
      const d = await r.json();
      if (!r.ok) { showMsg('student-msg', d.detail || '操作失败', 'error'); return; }
      showMsg('student-msg', '✅ 已清空全部学生名单');
      loadStudentList();
      loadExams();
    }
  );
}

function confirmNewSemester() {
  showConfirmDialog(
    '🔄 新学期重置',
    '此操作将删除<strong>所有学生名单、所有考试记录和全部成绩</strong>，相当于全新开始。<br><br>此操作<strong>无法撤销</strong>，确认继续？',
    async () => {
      const r = await fetch(`${API}/api/teacher/reset`, {
        method: 'POST',
        headers: {'Authorization': `Bearer ${TOKEN}`}
      });
      const d = await r.json();
      if (!r.ok) { showMsg('student-msg', d.detail || '操作失败', 'error'); return; }
      showMsg('student-msg', '✅ 新学期重置完成，所有数据已清空');
      currentExamId = null;
      examsData = [];
      loadStudentList();
      loadExams();
    }
  );
}

// ───── 确认对话框 ─────

function showConfirmDialog(title, message, onConfirm) {
  const backdrop = document.createElement('div');
  backdrop.className = 'confirm-dialog-backdrop';
  backdrop.innerHTML = `
    <div class="confirm-dialog">
      <h3>${title}</h3>
      <p>${message}</p>
      <div class="btn-row">
        <button class="btn btn-outline btn-sm" id="confirm-cancel">取消</button>
        <button class="btn btn-danger btn-sm" id="confirm-ok">确认执行</button>
      </div>
    </div>
  `;
  document.body.appendChild(backdrop);
  backdrop.querySelector('#confirm-cancel').onclick = () => backdrop.remove();
  backdrop.querySelector('#confirm-ok').onclick = () => { backdrop.remove(); onConfirm(); };
}

// ───── 初始化：检查已有 token ─────
if (TOKEN) {
  fetch(`${API}/api/teacher/exams`, { headers: {'Authorization': `Bearer ${TOKEN}`} })
    .then(r => {
      if (r.ok) {
        document.getElementById('login-page').style.display = 'none';
        document.getElementById('app').style.display = 'block';
        loadExams();
        loadStudentList();
      } else {
        TOKEN = ''; sessionStorage.removeItem('teacher_token');
      }
    }).catch(() => {});
}

// ───── 需求转 Issue 功能前端实现 ─────
async function previewIssues() {
  const f = document.getElementById('md-file').files[0];
  if (!f) { showMsg('issues-msg', '请先选择 Markdown 文件', 'error'); return; }
  const text = await f.text();
  try {
    const r = await fetch(`${API}/api/teacher/issues/preview`, {
      method: 'POST', headers: {'Authorization': `Bearer ${TOKEN}`, 'Content-Type':'application/json'},
      body: JSON.stringify({content: text})
    });
    if (!r.ok) { const e = await r.json(); showMsg('issues-msg', e.detail||'解析失败', 'error'); return; }
    const d = await r.json();
    renderPreviewItems(d.items || []);
  } catch(e) { showMsg('issues-msg', '网络错误：' + e, 'error'); }
}

function renderPreviewItems(items) {
  const area = document.getElementById('preview-area');
  if (!items.length) { area.innerHTML = '<p style="color:#888">未检测到 F-xxx 项目</p>'; return; }
  const rows = items.map(it => {
    const moduleBadge = it.module ? `<span style="display:inline-block;background:#e0f2fe;color:#0369a1;font-size:.75rem;padding:2px 8px;border-radius:10px;margin-right:6px">📌 ${escapeHtml(it.module)}</span>` : '';
    const protoBadge = it.prototype_name && it.prototype_page
      ? `<a href="prototype/${escapeHtml(it.prototype_page)}" target="_blank" style="display:inline-block;background:#f3e8ff;color:#7c3aed;font-size:.75rem;padding:2px 8px;border-radius:10px;text-decoration:none">📐 ${escapeHtml(it.prototype_name)}</a>`
      : '';
    return `
    <div style="border:1px solid #f0f0f0;padding:10px;border-radius:6px;margin-bottom:8px" data-id="${it.id}" data-module="${escapeHtml(it.module||'')}">
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:6px">
        <input style="flex:1;min-width:160px;padding:6px;border:1px solid #ddd;border-radius:4px" value="${escapeHtml(it.candidate_title)}" data-field="title" />
        <input style="width:150px;padding:6px;border:1px solid #ddd;border-radius:4px" data-field="labels" value="${(it.labels||[]).join(',')}" placeholder="标签" />
        <input style="width:120px;padding:6px;border:1px solid #ddd;border-radius:4px" data-field="assignee" placeholder="Assignee" />
      </div>
      <div style="margin-bottom:4px">${moduleBadge}${protoBadge}</div>
      <pre style="background:#fafafa;padding:8px;border-radius:4px;white-space:pre-wrap;font-size:.85rem">${escapeHtml(it.body||'')}</pre>
    </div>`;
  }).join('');
  area.innerHTML = `
    <div style="margin-bottom:8px">共 ${items.length} 条候选</div>
    ${rows}
    <div style="display:flex;gap:12px;align-items:center;margin-top:8px;flex-wrap:wrap">
      <label style="font-size:.9rem;color:#555">
        遇到已存在 Issue：
        <select id="on-conflict-select" style="padding:6px 10px;border:1px solid #ddd;border-radius:6px">
          <option value="skip">跳过</option>
          <option value="update">更新正文</option>
        </select>
      </label>
      <button class="btn btn-success" onclick="startCreateFromPreview()">开始批量创建</button>
      <button class="btn btn-outline" onclick="area.innerHTML=''">关闭</button>
    </div>
    <div id="create-progress" style="margin-top:12px"></div>
  `;
}

function escapeHtml(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

async function startCreateFromPreview() {
  const area = document.getElementById('preview-area');
  const nodes = Array.from(area.querySelectorAll('[data-id]'));
  if (!nodes.length) return;
  const items = nodes.map(node => ({
    id: node.getAttribute('data-id'),
    title: node.querySelector('[data-field="title"]').value.trim(),
    labels: node.querySelector('[data-field="labels"]').value.split(',').map(s=>s.trim()).filter(Boolean),
    assignee: node.querySelector('[data-field="assignee"]').value.trim() || null,
    body: node.querySelector('pre').innerText || ''
  }));
  // 首先尝试从输入框或 localStorage 获取 repo
  const repoInput = document.getElementById('issues-repo');
  const repo = (repoInput && repoInput.value && repoInput.value.trim()) || localStorage.getItem('oa_default_repo') || '';
  if (!repo) { showMsg('issues-msg', '请先设置目标仓库（owner/repo）', 'error'); return; }
  if (!validateRepo(repo)) { showMsg('issues-msg', '仓库格式应为 owner/repo，例如 uwislab/robotics-systems-course', 'error'); return; }
  const onConflict = (document.getElementById('on-conflict-select')?.value) || 'skip';
  try {
    const r = await fetch(`${API}/api/teacher/issues/create`, {
      method: 'POST', headers: {'Authorization': `Bearer ${TOKEN}`, 'Content-Type':'application/json'},
      body: JSON.stringify({repo, items, on_conflict: onConflict})
    });
    if (!r.ok) { const e = await r.json(); showMsg('issues-msg', e.detail||'创建任务失败', 'error'); return; }
    const d = await r.json();
    const taskId = d.task_id;
    document.getElementById('create-progress').innerHTML = `<div>任务已提交：${taskId}，开始轮询进度…</div>`;
    pollTaskStatus(taskId);
  } catch(e){ showMsg('issues-msg', '网络错误：'+e, 'error'); }
}

// 仓库相关工具函数：校验、保存、加载
function validateRepo(repo){
  // 简单校验 owner/repo，允许字母数字、下划线、点和短横线
  return /^[a-zA-Z0-9_.-]+\/[a-zA-Z0-9_.-]+$/.test(repo.trim());
}

function saveRepoToLocal(repo){
  // 若已登录，优先保存到后端配置；否则回退到 localStorage
  if (TOKEN) {
    fetch(`${API}/api/teacher/config`, {
      method: 'POST', headers: {'Authorization': `Bearer ${TOKEN}`, 'Content-Type':'application/json'},
      body: JSON.stringify({key: 'default_repo', value: repo.trim()})
    }).then(r=>{
      if (!r.ok) return r.json().then(e=>{ throw new Error(e.detail||'保存失败'); });
      localStorage.setItem('oa_default_repo', repo.trim());
      showMsg('issues-msg', '默认目标仓库已保存到服务器', 'success');
    }).catch(e=>{ showMsg('issues-msg', '保存到服务器失败：'+e, 'error'); });
  } else {
    try{ localStorage.setItem('oa_default_repo', repo.trim()); showMsg('issues-msg', '默认目标仓库已保存（仅本地）', 'success'); }
    catch(e){ showMsg('issues-msg', '保存失败：' + e, 'error'); }
  }
}

function loadRepoToInput(){
  const el = document.getElementById('issues-repo');
  if (!el) return;
  // 若已登录，先尝试从后端读取配置
  if (TOKEN) {
    fetch(`${API}/api/teacher/config?key=default_repo`, { headers: {'Authorization': `Bearer ${TOKEN}`} })
      .then(r=>{
        if (!r.ok) return null;
        return r.json();
      }).then(d=>{
        if (d && d.value) { el.value = d.value; localStorage.setItem('oa_default_repo', d.value); }
        else {
          const repo = localStorage.getItem('oa_default_repo') || '';
          if (repo) el.value = repo;
        }
      }).catch(()=>{
        const repo = localStorage.getItem('oa_default_repo') || '';
        if (repo) el.value = repo;
      });
  } else {
    const repo = localStorage.getItem('oa_default_repo') || '';
    if (repo) el.value = repo;
  }
}

// 绑定保存按钮
document.getElementById('save-repo-btn').addEventListener('click', ()=>{
  const el = document.getElementById('issues-repo');
  if (!el) return;
  const v = el.value.trim();
  if (!v) { showMsg('issues-msg','仓库不能为空','error'); return; }
  if (!validateRepo(v)) { showMsg('issues-msg','仓库格式错误，应为 owner/repo','error'); return; }
  saveRepoToLocal(v);
});

// 页面加载时填充
loadRepoToInput();

async function pollTaskStatus(taskId) {
  const el = document.getElementById('create-progress');
  const MAX_ATTEMPTS = 50;
  const BASE_INTERVAL = 1200;
  const MAX_INTERVAL = 30000;
  let attempt = 0;

  const statusIcon = { 'created':'✅','updated':'🔄','skipped':'⏭️','failed':'❌','pending':'⏳' };
  const statusLabel = { 'created':'已创建','updated':'已更新','skipped':'跳过','failed':'失败','pending':'等待中' };

  const render = (d) => {
    const total = (d.results||[]).length;
    const created = d.created || 0;
    const updated = d.updated || 0;
    const skipped = d.skipped || 0;
    const failed  = d.failed || 0;
    const done = created + updated + skipped + failed;
    const pct = total ? Math.round(done / total * 100) : 0;
    // Progress bar color
    let cls = 'progress-fill';
    if (failed > 0 && done === total) cls += ' has-only-err';
    else if (failed > 0 || (skipped > 0 && done === total)) cls += ' has-warn';
    // Item rows
    const parts = (d.results||[]).map(it => {
      const icon = statusIcon[it.status] || '❓';
      const label = statusLabel[it.status] || it.status;
      let extra = '';
      if (it.status==='created') extra = ` #${it.number} <a href="${it.url}" target="_blank">查看</a>`;
      if (it.status==='updated') extra = ` #${it.number} <a href="${it.url}" target="_blank">查看</a>`;
      if (it.status==='skipped' && it.existing) extra = ` 已存在 <a href="${it.existing.url}" target="_blank">#${it.existing.number}</a>`;
      if (it.status==='failed') extra = ` ${escapeHtml(it.reason||'')}`;
      return `<div style="padding:5px 0;border-bottom:1px solid #f3f3f3;font-size:.9rem">${icon} ${escapeHtml(it.title)}${extra}</div>`;
    }).join('');
    // Summary counts
    const counts = [];
    if (created) counts.push(`✅ 创建 ${created}`);
    if (updated) counts.push(`🔄 更新 ${updated}`);
    if (skipped) counts.push(`⏭️ 跳过 ${skipped}`);
    if (failed)  counts.push(`❌ 失败 ${failed}`);
    el.innerHTML = `
      <div class="progress-root"><div class="${cls}" style="width:${pct}%"></div></div>
      <div style="display:flex;justify-content:space-between;font-size:.85rem;color:#555">
        <span>${pct}% (${done}/${total})</span>
        <span>${counts.join(' · ')}</span>
        <span>状态：${d.status||'unknown'}</span>
      </div>
      <div style="margin-top:10px">${parts}</div>
    `;
  };

  const poll = async () => {
    attempt++;
    try {
      const r = await fetch(`${API}/api/teacher/issues/task/${taskId}`, { headers: {'Authorization': `Bearer ${TOKEN}`} });
      if (!r.ok) {
        el.innerHTML = `<div class="alert alert-error">获取任务状态失败（HTTP ${r.status}）</div>`;
        return;
      }
      const d = await r.json();
      render(d);
      if ((d.status||'') !== 'finished') {
        if (attempt >= MAX_ATTEMPTS) {
          el.innerHTML = '<div class="alert alert-error">⏱ 轮询超时，任务未能按时完成。请稍后刷新页面查看 Issue 是否已创建，或检查后端日志。</div>';
          return;
        }
        const delay = Math.min(BASE_INTERVAL * Math.pow(1.5, attempt - 1), MAX_INTERVAL);
        setTimeout(poll, delay);
      }
    } catch(e) {
      const delay = Math.min(BASE_INTERVAL * Math.pow(1.5, attempt), MAX_INTERVAL);
      if (attempt >= MAX_ATTEMPTS) {
        el.innerHTML = '<div class="alert alert-error">⏱ 网络请求持续失败，已停止轮询。请稍后刷新页面重试。</div>';
      } else {
        el.innerHTML = `<div class="alert alert-warning">网络请求异常：${escapeHtml(e.message||e)}，${Math.round(delay/1000)}s 后重试（第 ${attempt}/${MAX_ATTEMPTS} 次）</div>`;
        setTimeout(poll, delay);
      }
    }
  };
  poll();
}
